<link rel="stylesheet" href="https://unpkg.com/@wordpress/components@29.12.0/build-style/style.css">
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 28.1
// @title Form fields built from the admin's questions
// @section 28.1
import { createRoot, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button, TextareaControl } from '@wordpress/components'; // Added so this runs on its own
import { __, sprintf } from '@wordpress/i18n'; // Added so this runs on its own

export const JoinQuestionFields = ( { questions, value, onChange } ) =>
  questions.map( ( question ) => (
    <TextareaControl
      key={ question.key }
      __nextHasNoMarginBottom
      label={
        question.required
          ? question.label
          : sprintf(
              /* translators: %s: a question, e.g. "What brings you here?" */
              __( '%s (optional)', 'forumwp' ),
              question.label
            )
      }
      rows={ 3 }
      maxLength={ 1000 }
      required={ question.required }
      value={ value[ question.key ] ?? '' }
      onChange={ ( answer ) => onChange( { ...value, [ question.key ]: answer } ) }
    />
  ) );

// Added so this runs on its own: the questions the server would send, and a form that shows
// the one answers object as you type.
const joinQuestions = [
  { key: 'q_k3j9ab', label: 'What brings you here?', required: true },
  { key: 'q_7mzq2c', label: 'Your website', required: false },
];

const JoinForm = () => {
  const [ answers, setAnswers ] = useState( {} );
  return (
    <form
      style={ { display: 'grid', gap: 16, maxWidth: 420 } }
      onSubmit={ ( event ) => {
        event.preventDefault();
        console.log( 'Sending answers:', answers );
      } }
    >
      <JoinQuestionFields questions={ joinQuestions } value={ answers } onChange={ setAnswers } />
      <Button variant="primary" type="submit">Create account</Button>
      <pre>{ JSON.stringify( answers, null, 2 ) }</pre>
    </form>
  );
};

createRoot( document.getElementById( 'forumwp-root' ) ).render( <JoinForm /> );

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
