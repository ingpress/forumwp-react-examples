  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }

  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 26.2
// @title Letting add-ons change your screens with applyFilters and addFilter
// @section 26.2
import { createRoot, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button } from '@wordpress/components'; // Added so this runs on its own
import { sprintf, _n } from '@wordpress/i18n'; // Added so this runs on its own
import { removeFilter } from '@wordpress/hooks'; // Added so this runs on its own

// app/portal/components/ModerationLog.js (ForumWP)
import { applyFilters } from '@wordpress/hooks';

// Added so this runs on its own: the function around the book's return. The real one first
// handles ForumWP's own actions; here only "removed_post".
const logText = ( item ) => {
  const who = item.actor.name;
  if ( item.action === 'removed_post' ) {
    return sprintf( '%1$s removed a post by %2$s', who, item.subject.name );
  }

  return applyFilters(
    'forumwp.moderationLogText',
    `${ who }: ${ item.action }`,   // the fallback
    item
  );
};

// app/portal/index.js (ForumWP Pro)
import { addFilter } from '@wordpress/hooks';

addFilter( 'forumwp.moderationLogText', 'forumwp-pro', ( text, item ) => {
  if ( item.action !== 'auto_hidden' ) {
    return text;   // not ours: pass it on unchanged
  }
  return sprintf( _n( 'A post by %1$s was hidden after %2$d report', 'A post by %1$s was hidden after %2$d reports', item.data.reports, 'forumwp-pro' ), item.subject.name, item.data.reports );
} );

// Added so this runs on its own: four log entries, and a button that removes Pro's filter by its
// namespace, so you can see the fallback text.
const ENTRIES = [
  { id: 1, action: 'removed_post', actor: { name: 'Ada' }, subject: { name: 'Tunde' }, data: {} },
  { id: 2, action: 'auto_hidden', actor: { name: 'ForumWP' }, subject: { name: 'Grace' }, data: { reports: 1 } },
  { id: 3, action: 'auto_hidden', actor: { name: 'ForumWP' }, subject: { name: 'Tunde' }, data: { reports: 3 } },
  { id: 4, action: 'pinned_post', actor: { name: 'Ada' }, subject: { name: 'Grace' }, data: {} },
];
const ModerationLog = () => {
  const [ , setVersion ] = useState( 0 );
  return (
    <>
      <ul>{ ENTRIES.map( ( item ) => <li key={ item.id }>{ logText( item ) }</li> ) }</ul>
      <Button variant="secondary" onClick={ () => { removeFilter( 'forumwp.moderationLogText', 'forumwp-pro' ); setVersion( ( v ) => v + 1 ); } }>
        Deactivate ForumWP Pro (remove its filter)
      </Button>
    </>
  );
};

createRoot( document.getElementById( 'forumwp-root' ) ).render( <ModerationLog /> ); // Added so this runs on its own

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
