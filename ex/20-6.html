  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<script type="text/plain" id="example">
// @id 20.6
// @title Broken: changing the context value in place
// @section 20.6
// @click Save
import { createRoot, createContext, useContext, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button } from '@wordpress/components'; // Added so this runs on its own

// Added so this runs on its own: PortalProvider and useCurrentUser (Example 20.2).
const PortalContext = createContext( null );
const PortalProvider = ( { data, children } ) => {
  const [ currentUser, setCurrentUser ] = useState( data.currentUser );
  return (
    <PortalContext.Provider value={ { ...data, currentUser, setCurrentUser } }>
      { children }
    </PortalContext.Provider>
  );
};
const useCurrentUser = () => useContext( PortalContext ).currentUser;

// Added so this runs on its own: a profile page that "saves" a new photo and shows it from the saved data.
const ProfilePage = () => {
  const [ saved, setSaved ] = useState(null);
  const user = useCurrentUser();

  const onSaved = (saved) => {
    user.avatarUrl = saved.avatarUrl;   // WRONG
  };

  return (
    <div className="fwp-card">
      <p>Profile page photo: <img className="fwp-avatar" src={saved ? saved.avatarUrl : user.avatarUrl} width="48" height="48" alt="" /></p>
      <Button variant="primary" onClick={() => {
        const answer = { avatarUrl: 'https://i.pravatar.cc/96?img=45' };
        onSaved(answer);
        setSaved(answer);
      }}>Save new photo</Button>
    </div>
  );
};
const Topbar = () => {
  const user = useCurrentUser();
  return <header>Top bar photo: <img className="fwp-avatar" src={user.avatarUrl} width="32" height="32" alt="" /> (stays old after saving)</header>;
};

window.forumwpData = { currentUser: { id: 1, name: 'Ada', avatarUrl: 'https://i.pravatar.cc/96?img=47' } };
createRoot(document.getElementById('forumwp-root')).render(
  <PortalProvider data={window.forumwpData}>
    <Topbar />
    <ProfilePage />
  </PortalProvider>
);

</script>
<script>

  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
