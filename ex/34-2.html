<title>34.2: &quot;Mark complete&quot; puts the server&#x27;s answer in the cache</title>
<!-- ForumWP React course, 34.2: runs as it is in JSFiddle, CodePen or straight from your computer. -->
<link rel="stylesheet" href="https://unpkg.com/@wordpress/components@29.12.0/build-style/style.css">
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

{
  "imports": {

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 34.2
// @title "Mark complete" puts the server's answer in the cache
// @section 34.5
// @click Mark complete
import { createRoot } from '@wordpress/element'; // Added so this runs on its own
import { Button, Icon, Spinner } from '@wordpress/components'; // Added so this runs on its own
import { check, lock } from '@wordpress/icons'; // Added so this runs on its own
import {
  QueryClient,
  QueryClientProvider,
  useMutation,
  useQuery,
  useQueryClient,
} from '@tanstack/react-query'; // Added so this runs on its own

// Added so this runs on its own: a pretend server for an "in order" course. Every course route
// answers with the whole outline as it is now, as ForumWP Pro's do.
const LESSONS = [
  { id: 410, title: 'Welcome' },
  { id: 411, title: 'Your first space' },
  { id: 412, title: 'Inviting members' },
];
const done = new Set();
const outline = () => {
  const lessons = LESSONS.map( ( l, i ) => ( {
    ...l,
    done: done.has( l.id ),
    // In order: a lesson opens when the one before it is done.
    locked: i > 0 && ! done.has( LESSONS[ i - 1 ].id ),
  } ) );
  return {
    modules: [ { title: 'Getting started', lessons } ],
    progress: { done: done.size, total: LESSONS.length, completed: done.size === LESSONS.length },
  };
};
const server = {
  course() {
    console.log( 'GET /spaces/7/course' );
    return new Promise( ( resolve ) => setTimeout( () => resolve( outline() ), 300 ) );
  },
  complete( id, on ) {
    console.log( `POST /course/lessons/${ id }/complete`, { done: on } );
    return new Promise( ( resolve ) =>
      setTimeout( () => {
        if ( on ) {
          done.add( id );
        } else {
          done.delete( id );
        }
        resolve( outline() );
      }, 700 )
    );
  },
};

const courseKey = ( spaceId ) => [ 'forumwp-pro', 'course', spaceId ];
const useCourse = ( spaceId ) => useQuery( { queryKey: courseKey( spaceId ), queryFn: () => server.course() } ); // Added so this runs on its own

const useCourseChange = ( spaceId, mutationFn ) => {
  const queryClient = useQueryClient();

  return useMutation( {
    mutationFn,
    onSuccess: ( data ) => {
      if ( data?.modules ) {
        queryClient.setQueryData( courseKey( spaceId ), data );
      } else {
        queryClient.invalidateQueries( { queryKey: courseKey( spaceId ) } );
      }
      queryClient.invalidateQueries( { queryKey: [ 'forumwp-pro', 'lesson' ] } );
      if ( data?.progress?.completed ) {
        console.log( 'Course finished: the bell would refetch its count now.' );
      }
    },
  } );
};

const useComplete = ( spaceId, lessonId ) =>
  useCourseChange( spaceId, ( on ) => server.complete( lessonId, on ) );

const LessonRow = ( { lesson } ) => {
  const complete = useComplete( 7, lesson.id );
  const { done: isDone } = lesson;

  return (
    <li className="fwp-row" style={ { alignItems: 'center', gap: 8 } }>
      <Icon icon={ lesson.locked ? lock : check } style={ { opacity: lesson.locked || isDone ? 1 : 0.2 } } />
      <span style={ { minWidth: 140 } }>{ lesson.title }</span>
      <Button
        variant="primary"
        aria-pressed={ isDone }
        isBusy={ complete.isPending }
        disabled={ lesson.locked }
        accessibleWhenDisabled
        onClick={ () => complete.mutate( ! isDone ) }
      >
        { isDone ? 'Done (undo)' : 'Mark complete' }
      </Button>
    </li>
  );
};

// Added so this runs on its own: the outline and progress, drawn from the cache.
const Outline = () => {
  const { data: course } = useCourse( 7 );
  if ( ! course ) {
    return <Spinner />;
  }
  const { progress } = course;

  return (
    <div style={ { maxWidth: 480 } }>
      <p>
        Progress: { progress.done } of { progress.total }
        { progress.completed && ' (you finished the course!)' }
      </p>
      <ol style={ { display: 'grid', gap: 8, padding: 0, listStyle: 'none' } }>
        { course.modules[ 0 ].lessons.map( ( lesson ) => (
          <LessonRow key={ lesson.id } lesson={ lesson } />
        ) ) }
      </ol>
      <p className="fwp-muted">After each click there is one POST and no second GET: the answer is the new outline.</p>
    </div>
  );
};

createRoot( document.getElementById( 'forumwp-root' ) ).render(
  <QueryClientProvider client={ new QueryClient() }>
    <Outline />
  </QueryClientProvider>
);

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
</body>
