<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 32.3
// @title Celebrations, one at a time and never twice
// @section 32.3
// @click Publish your first post
import { createRoot, useEffect, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button } from '@wordpress/components'; // Added so this runs on its own

const SHOW_FOR = 3000; // 6000 in ForumWP; shorter here
window.forumwpData = { celebrations: true }; // Added so this runs on its own

// Added so this runs on its own: the server's per-member queue, and DELETE /celebrations/{id}.
const server = { queue: [] };
const remove = ( path ) => {
  const id = path.split( '/' ).pop();
  server.queue = server.queue.filter( ( c ) => c.id !== id );
  console.log( 'DELETE', path );
  return Promise.resolve();
};

// Waiting celebrations, and ones already shown (so none plays twice).
const waiting = [];
const shown = new Set();
let wake = () => {};

const celebrate = ( celebration ) => {
  const message = String( celebration?.message ?? '' ).trim();
  const key = celebration?.id ?? `${ celebration?.reason }:${ message }`;
  if ( ! message || ! window.forumwpData?.celebrations || shown.has( key ) ) {
    return;
  }
  shown.add( key );
  waiting.push( { ...celebration, message } );
  wake();
};

const calm = () => window.matchMedia?.( '(prefers-reduced-motion: reduce)' ).matches;

const Celebration = () => {
  const [ current, setCurrent ] = useState( null );

  // Pick up new ones.
  useEffect( () => {
    wake = () => setCurrent( ( showing ) => showing ?? waiting.shift() ?? null );
    wake();

    return () => {
      wake = () => {};
    };
  }, [] );

  useEffect( () => {
    if ( ! current ) {
      return;
    }
    if ( current.id ) {
      // Seen: it won't come back on the next visit.
      remove( `/celebrations/${ current.id }` ).catch( () => {} );
    }
    console.log( calm() ? 'Showing (no confetti: reduced motion)' : 'Showing, with confetti:', current.message );
    const next = window.setTimeout( () => setCurrent( waiting.shift() ?? null ), SHOW_FOR );

    return () => window.clearTimeout( next );
  }, [ current ] );

  return (
    <div className="fwp-card" style={ { minHeight: 48, background: current ? '#fff7d6' : undefined } }>
      { /* Always in the page, so screen readers hear what appears in it. */ }
      <p role="status" aria-live="polite" style={ { margin: 0 } }>
        { current?.message ?? '' }
      </p>
      { current && (
        <Button size="small" onClick={ () => setCurrent( waiting.shift() ?? null ) }>
          Close
        </Button>
      ) }
    </div>
  );
};

// Added so this runs on its own: buttons that queue celebrations, as the server and an add-on would.
let n = 0;
const App = () => (
  <div style={ { display: 'grid', gap: 12, maxWidth: 480 } }>
    <Celebration />
    <div className="fwp-row">
      <Button
        variant="primary"
        onClick={ () => {
          // The server queues it (with an id); the app loads the queue and passes each to celebrate().
          if ( ! server.queue.length ) {
            server.queue.push( { id: `c${ ++n }`, reason: 'first_post', message: 'Your first post! You earned the First post badge.' } );
          }
          server.queue.forEach( celebrate );
        } }
      >
        Publish your first post
      </Button>
      <Button variant="secondary" onClick={ () => server.queue.forEach( celebrate ) }>
        Load the queue again (a refetch)
      </Button>
      <Button variant="secondary" onClick={ () => celebrate( { reason: 'level', message: 'You reached level 2!' } ) }>
        An add-on celebrates in the browser
      </Button>
    </div>
    <p className="fwp-muted">Click all three quickly: they show one after another, and the refetch adds nothing.</p>
  </div>
);

createRoot( document.getElementById( 'forumwp-root' ) ).render( <App /> );

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
