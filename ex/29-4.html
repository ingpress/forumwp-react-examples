<title>29.4: One vote, every cached list of replies</title>
<!-- ForumWP React course, 29.4: runs as it is in JSFiddle, CodePen or straight from your computer. -->
<link rel="stylesheet" href="https://unpkg.com/@wordpress/components@29.12.0/build-style/style.css">
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 29.4
// @title One vote, every cached list of replies
// @section 29.4
// @click Upvote
import { createRoot, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button, ToggleControl } from '@wordpress/components'; // Added so this runs on its own
import {
  QueryClient,
  QueryClientProvider,
  useInfiniteQuery,
  useMutation,
  useQueryClient,
} from '@tanstack/react-query'; // Added so this runs on its own

// Added so this runs on its own: a pretend server with two replies and a vote that can fail.
const server = {
  votes: { 1: 0, 2: 3 },
  fail: false,
  replies( sort ) {
    const items = [
      { id: 1, author: 'Tunde', text: 'Clear the cache.', votes: { count: server.votes[ 1 ], voted: false } },
      { id: 2, author: 'Kemi', text: 'Check the webhook secret.', votes: { count: server.votes[ 2 ], voted: false } },
    ];
    if ( sort === 'top' ) {
      items.sort( ( a, b ) => b.votes.count - a.votes.count );
    }
    return new Promise( ( resolve ) => setTimeout( () => resolve( { items, next_cursor: null } ), 300 ) );
  },
  vote( id, on ) {
    return new Promise( ( resolve, reject ) =>
      setTimeout( () => {
        if ( server.fail ) {
          reject( new Error( 'The server said no.' ) );
          return;
        }
        server.votes[ id ] += on ? 1 : -1;
        resolve( { count: server.votes[ id ], voted: on } );
      }, 800 )
    );
  },
};

const useReplies = ( postId, sort ) =>
  useInfiniteQuery( {
    // Each sort is its own cache entry; they share the [ 'comments', postId ] start.
    queryKey: [ 'comments', postId, sort ],
    queryFn: () => server.replies( sort ),
    initialPageParam: 0,
    getNextPageParam: ( last ) => last.next_cursor ?? undefined,
  } );

// Changes one reply in every cached list of the post's replies.
const updateReply = ( queryClient, postId, id, change ) =>
  queryClient.setQueriesData( { queryKey: [ 'comments', postId ] }, ( data ) =>
    data
      ? {
          ...data,
          pages: data.pages.map( ( page ) => ( {
            ...page,
            items: page.items.map( ( c ) =>
              c.id === id ? { ...c, votes: { ...c.votes, ...change( c.votes ) } } : c
            ),
          } ) ),
        }
      : data
  );

const useReplyVote = ( postId, id ) => {
  const queryClient = useQueryClient();
  const flip = ( on ) => ( v ) =>
    v.voted === on ? {} : { voted: on, count: v.count + ( on ? 1 : -1 ) };

  return useMutation( {
    mutationFn: ( on ) => server.vote( id, on ),
    onMutate: ( on ) => updateReply( queryClient, postId, id, flip( on ) ),
    onError: ( error, on ) => {
      console.log( error.message, '— putting the vote back' );
      updateReply( queryClient, postId, id, flip( ! on ) );
    },
    onSuccess: ( result ) => updateReply( queryClient, postId, id, () => result ),
  } );
};

const Reply = ( { reply } ) => {
  const vote = useReplyVote( 12, reply.id );

  return (
    <li>
      <Button
        variant={ reply.votes.voted ? 'primary' : 'secondary' }
        onClick={ () => vote.mutate( ! reply.votes.voted ) }
      >
        Upvote ({ reply.votes.count })
      </Button>{ ' ' }
      <strong>{ reply.author }:</strong> { reply.text }
    </li>
  );
};

const Replies = ( { sort } ) => {
  const { data, isPending } = useReplies( 12, sort );
  if ( isPending ) {
    return <p>Loading…</p>;
  }
  return (
    <ul>
      { data.pages.flatMap( ( p ) => p.items ).map( ( reply ) => (
        <Reply key={ reply.id } reply={ reply } />
      ) ) }
    </ul>
  );
};

const App = () => {
  const [ fail, setFail ] = useState( false );

  return (
    <div className="fwp-stack">
      <ToggleControl
        __nextHasNoMarginBottom
        label="Make the server refuse votes"
        checked={ fail }
        onChange={ ( on ) => {
          server.fail = on;
          setFail( on );
        } }
      />
      <h3>Oldest first</h3>
      <Replies sort="oldest" />
      <h3>Top</h3>
      <Replies sort="top" />
    </div>
  );
};

createRoot( document.getElementById( 'forumwp-root' ) ).render(
  <QueryClientProvider client={ new QueryClient() }>
    <App />
  </QueryClientProvider>
);

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
</body>
