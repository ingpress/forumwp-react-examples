  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }

  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 19.7
// @title useSearchParams: a tab kept in the query string
// @section 19.7
// @click Waiting
// From app/portal/screens/Members.js (trimmed)
import { createRoot } from '@wordpress/element';
// Added so this runs on its own: the imports Members.js has in the real plugin.
import { Button } from '@wordpress/components';
import { __ } from '@wordpress/i18n';
import { MemoryRouter, useSearchParams, useLocation } from 'react-router-dom';

// Added so this runs on its own: an admin as the current member (Chapter 20 shows the real useCurrentUser).
const useCurrentUser = () => ({ id: 1, name: 'Ada', isAdmin: true });

// Added so this runs on its own: a small stand-in for ForumWP's own Tabs component.
const Tabs = ({ label, current, onChange, tabs }) => (
  <div role="group" aria-label={label}>
    {tabs.map((tab) => (
      <Button key={tab.name} variant={tab.name === current ? 'primary' : 'secondary'} onClick={() => onChange(tab.name)}>
        {tab.title}
      </Button>
    ))}
  </div>
);

// Added so this runs on its own: shows the address, so you can watch the query string change.
const Address = () => {
  const location = useLocation();
  return <p>Address: <code>/community{location.pathname}{location.search}</code></p>;
};

const Members = () => {
  const user = useCurrentUser();
  const [ params, setParams ] = useSearchParams();
  const status = user?.isAdmin
    ? ( params.get( 'status' ) ?? 'active' )
    : 'active';

  // ...
  // Added so this runs on its own: the screen's other content, reduced to one line.
  console.log('Members rendered with status', status);

  return (
    <Tabs
      label={ __( 'Member status', 'forumwp' ) }
      current={ status }
      onChange={ ( next ) =>
        setParams( next === 'active' ? {} : { status: next } )
      }
      tabs={ [ /* active, pending, suspended */
        // Added so this runs on its own: the three tabs.
        { name: 'active', title: 'Members' },
        { name: 'pending', title: 'Waiting for approval' },
        { name: 'suspended', title: 'Suspended' },
      ] }
    />
  );
};

// In the course this is BrowserRouter; MemoryRouter keeps the address inside the example so it runs anywhere.
createRoot(document.getElementById('forumwp-root')).render(
  <MemoryRouter initialEntries={['/members']}>
    <Address />
    <Members />
  </MemoryRouter>
);

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
