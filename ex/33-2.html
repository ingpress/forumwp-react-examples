<title>33.2: Tabs that are links first, and switch in place with a script</title>
<!-- ForumWP React course, 33.2: runs as it is in JSFiddle, CodePen or straight from your computer. -->
<link rel="stylesheet" href="https://unpkg.com/@wordpress/components@29.12.0/build-style/style.css">
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 33.2
// @title Tabs that are links first, and switch in place with a script
// @section 33.2
// No React here: the page around a block isn't a React app.

// Added so this runs on its own: the HTML render_topic_tabs() prints. Every list is in the page,
// all but one hidden, and each tab is a link that would reload on that list.
const id = 'fwp-topics-1';
const TABS = { latest: 'Latest', unanswered: 'Unanswered', solved: 'Solved' };
const LISTS = {
  latest: [ 'Webhooks fire twice', 'Dark mode colours', 'Importing from bbPress' ],
  unanswered: [ 'Dark mode colours' ],
  solved: [ 'Webhooks fire twice', 'Importing from bbPress' ],
};
const current = new URLSearchParams( window.location.search ).get( 'fwp_tab' ) ?? 'latest';
document.getElementById( 'forumwp-root' ).innerHTML = `
  <label><input type="checkbox" id="use-js" checked> Run view.js (untick, then click a tab, to see the links work without it)</label>
  <div class="fwp-block fwp-block-topics fwp-tabs" id="${ id }" style="margin-top:12px">
    <div class="fwp-tabs__list" role="tablist" aria-label="Topics" style="display:flex;gap:12px">
      ${ Object.entries( TABS ).map( ( [ tab, label ] ) => `<a role="tab" id="${ id }-tab-${ tab }" href="?fwp_tab=${ tab }#${ id }" aria-controls="${ id }-${ tab }" aria-selected="${ tab === current }" tabindex="${ tab === current ? 0 : -1 }">${ label }</a>` ).join( '' ) }
    </div>
    ${ Object.keys( TABS ).map( ( tab ) => `<div role="tabpanel" id="${ id }-${ tab }" aria-labelledby="${ id }-tab-${ tab }" tabindex="0"${ tab === current ? '' : ' hidden' }><ul>${ LISTS[ tab ].map( ( t ) => `<li>${ t }</li>` ).join( '' ) }</ul></div>` ).join( '' ) }
  </div>
  <style>[aria-selected="true"]{font-weight:bold;text-decoration:none}</style>`;

// blocks/topics/view.js, as ForumWP ships it (wrapped in a check of the box above).
const enhance = () =>
  document.querySelectorAll( '.fwp-tabs' ).forEach( ( root ) => {
    const tabs = [ ...root.querySelectorAll( '[role="tab"]' ) ];
    const select = ( tab ) => {
      tabs.forEach( ( t ) => {
        const on = t === tab;
        t.setAttribute( 'aria-selected', on ? 'true' : 'false' );
        t.tabIndex = on ? 0 : -1;
        root.querySelector( '#' + t.getAttribute( 'aria-controls' ) ).hidden = ! on;
      } );
      tab.focus();
    };
    root.addEventListener( 'click', ( e ) => {
      const tab = e.target.closest( '[role="tab"]' );
      if ( tab && document.getElementById( 'use-js' ).checked ) {
        e.preventDefault();
        select( tab );
        console.log( 'Switched in place to', tab.textContent );
      }
    } );
    root.addEventListener( 'keydown', ( e ) => {
      const i = tabs.indexOf( e.target );
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[ e.key ];
      if ( i < 0 || to === undefined ) {
        return;
      }
      e.preventDefault();
      select( tabs[ ( to + tabs.length ) % tabs.length ] );
    } );
  } );
enhance();
console.log( `Drawn by "PHP" with fwp_tab=${ current }. Click a tab, or focus one and use the arrow keys.` );

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
