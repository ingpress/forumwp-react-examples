<title>2.9: Truthy, falsy, &amp;&amp; || ?? and ?.</title>
<!-- ForumWP React course, 2.9: runs as it is in JSFiddle, CodePen or straight from your computer. -->
<link rel="stylesheet" href="https://unpkg.com/@wordpress/components@29.12.0/build-style/style.css">
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

  "imports": {

<script src="https://unpkg.com/@babel/standalone@7.27.6/babel.min.js"></script>
</head>
<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 2.9
// @title Truthy, falsy, && || ?? and ?.
// @section 2.9
import { createRoot } from '@wordpress/element'; // Added so this runs on its own

// Added so this runs on its own: show() prints what you'd type in the console and what it shows.
const show = (typed, value) => console.log(`> ${typed}\n`, typeof value === 'string' ? `'${value}'` : value === undefined ? 'undefined' : value);

// Added so this runs on its own: the console lines from the book.
show("'0' ? 'truthy' : 'falsy'", '0' ? 'truthy' : 'falsy');
show("[] ? 'truthy' : 'falsy'", [] ? 'truthy' : 'falsy');
show("'Ada' || 'Anonymous'", 'Ada' || 'Anonymous');
show("'' || 'Anonymous'", '' || 'Anonymous');
show("true && 'Pinned'", true && 'Pinned');
show("false && 'Pinned'", false && 'Pinned');
const perPage = 0;
show('perPage || 20', perPage || 20);
show("0 && 'likes'", 0 && 'likes');
show('0 ?? 20', 0 ?? 20);
show('null ?? 20', null ?? 20);
show("undefined ?? 'Anonymous'", undefined ?? 'Anonymous');

// Added so this runs on its own: a member and a post, and a component for the JSX lines.
const member = { display_name: '' };
const PinnedTitle = ({ post }) => {
  const name = member.display_name || 'Anonymous';
  return (
    <p className="fwp-post">
      {post.title} by {name}
      {post.pinned && <span className="fwp-badge">Pinned</span>}
    </p>
  );
};

// Added so this runs on its own: the BROKEN line, in a component, for a post with no reactions.
const BrokenLikes = ({ post }) => (
  <p className="fwp-post">
    BROKEN: {post.title}{' '}
    {/* BROKEN: shows a stray "0" on posts with no reactions */}
    {post.reactions && <span>{post.reactions} likes</span>}
  </p>
);
// Added so this runs on its own: the fix.
const FixedLikes = ({ post }) => (
  <p className="fwp-post">
    Fixed: {post.title}{' '}
    {post.reactions > 0 && <span>{post.reactions} likes</span>}
  </p>
);

{ // Added so this runs on its own: a block keeps each snippet's `post` apart
  const post = { title: 'Hello from Tunde', reactions: 0 };
  const reactions = post.reactions ?? 0;
  show('reactions', reactions); // Added so this runs on its own
}

{ // Added so this runs on its own: optional chaining
  const post = { id: 881 };
  try {
    post.author.name;
  } catch (error) {
    console.log(`> post.author.name\n Uncaught ${error.name}: ${error.message}`);
  }
  show('post.author?.name', post.author?.name);
  show("post.author?.name ?? 'Former member'", post.author?.name ?? 'Former member');

  const onDelete = undefined; // Added so this runs on its own: nothing was passed in
  post.tags?.[0];   // first tag, or undefined if there are no tags
  onDelete?.();     // call onDelete only if it was passed in
  show('post.tags?.[0]', post.tags?.[0]); // Added so this runs on its own
  console.log('onDelete?.() ran without an error'); // Added so this runs on its own
}

// Added so this runs on its own
createRoot(document.getElementById('forumwp-root')).render(
  <>
    <PinnedTitle post={{ title: 'Welcome to the community', pinned: true }} />
    <PinnedTitle post={{ title: 'How do I change my avatar?', pinned: false }} />
    <BrokenLikes post={{ title: 'How do I change my avatar?', reactions: 0 }} />
    <FixedLikes post={{ title: 'How do I change my avatar?', reactions: 0 }} />
  </>
);

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
</body>
