  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }

  #console:empty { display: none; }

  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>

<div id="console"></div>

<script type="text/plain" id="example">
// @id 28.3
// @title A draft that never remembers "email everyone"
// @section 28.3
import { createRoot, useEffect, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button, CheckboxControl, TextareaControl } from '@wordpress/components'; // Added so this runs on its own

// Added so this runs on its own: a small version of the composer's draft helpers (Chapter 27.3),
// kept in memory instead of localStorage so the example works in any sandbox.
const storage = new Map();
const saveDraft = ( key, form ) => storage.set( key, JSON.stringify( { form, savedAt: Date.now() } ) );
const loadDraft = ( key ) => ( storage.has( key ) ? JSON.parse( storage.get( key ) ).form : null );
const EMPTY = { body: '', emailEveryone: false, extra: {} };
const storageKey = 'fwp-draft:/community:1:7';

const Composer = () => {
  const [ saved ] = useState( () => loadDraft( storageKey ) );
  const [ form, setForm ] = useState( () =>
    saved ? { ...EMPTY, ...saved, extra: {}, emailEveryone: false } : EMPTY
  );
  const set = ( key ) => ( value ) => setForm( { ...form, [ key ]: value } );

  useEffect( () => {
    saveDraft( storageKey, {
      ...form,
      extra: undefined,
      // Emailing everyone is ticked again each time, never restored from a draft.
      emailEveryone: undefined,
    } );
  }, [ form ] );

  return (
    <div style={ { display: 'grid', gap: 12, maxWidth: 420 } }>
      <TextareaControl __nextHasNoMarginBottom label="Post" value={ form.body } onChange={ set( 'body' ) } />
      <CheckboxControl
        __nextHasNoMarginBottom
        label="Also email this to everyone"
        checked={ !! form.emailEveryone }
        onChange={ set( 'emailEveryone' ) }
      />
      <p>
        What the draft stores:{ ' ' }
        <code>{ JSON.stringify( { ...form, extra: undefined, emailEveryone: undefined } ) }</code>
      </p>
    </div>
  );
};

// Added so this runs on its own: "Close and reopen" remounts the composer, like coming back later.
const App = () => {
  const [ n, setN ] = useState( 0 );
  return (
    <>
      <Composer key={ n } />
      <Button variant="secondary" onClick={ () => setN( n + 1 ) }>Close and reopen</Button>
    </>
  );
};

createRoot( document.getElementById( 'forumwp-root' ) ).render( <App /> );

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;

  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
