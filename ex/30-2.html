  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1e1e1e; }
  .fwp-space-card, .fwp-post, .fwp-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .fwp-badge { background: #eef; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .fwp-avatar { border-radius: 50%; vertical-align: middle; }
  #console { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 8px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #333; }
  #console:empty { display: none; }
  #console .error { color: #b32d2e; }
  #console .warn { color: #8a6100; }
</style>
<script>
  // Shows console output on the page too (the course often asks you to look at it).
  (() => {
    const show = (type, args) => {
      const box = document.getElementById('console');
      if (!box) return;
      // Fill in %s / %d / %o placeholders and drop %c styling, as the browser console does.
      if (typeof args[0] === 'string' && /%[sdioOc]/.test(args[0])) {
        let rest = args.slice(1);
        const first = args[0].replace(/%([sdioOc])/g, (m, t) => {
          if (!rest.length) return '';
          const v = rest.shift();
          return t === 'c' ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
        });
        args = [first, ...rest];
      }
      if (typeof args[0] === 'string' && args[0].startsWith('Download the React DevTools')) return;
      const line = document.createElement('div');
      line.className = type;
      line.textContent = args.map((a) => {
        if (typeof a === 'string') return a;
        if (a instanceof Error) return a.name + ': ' + a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      box.appendChild(line);
    };
    for (const type of ['log', 'info', 'warn', 'error']) {
      const original = console[type].bind(console);
      console[type] = (...args) => { original(...args); show(type, args); };
    }
    window.addEventListener('error', (e) => show('error', ['Uncaught ' + (e.error ? e.error.name + ': ' + e.error.message : e.message)]));
    window.addEventListener('unhandledrejection', (e) => show('error', ['Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  })();
</script>

<body>
<div id="forumwp-root"></div>
<div id="console"></div>

<script type="text/plain" id="example">
// @id 30.2
// @title Remembering "not known yet" as the answer
// @section 30.3
// @click Run the request
import { createRoot, useState } from '@wordpress/element'; // Added so this runs on its own
import { Button, ToggleControl } from '@wordpress/components'; // Added so this runs on its own

// Added so this runs on its own: Page::current() written in JavaScript, both versions.
// One request: plugins load, then WordPress reads the address, then the head is printed.
const request = { parsed: false, path: '' };
const detect = () => {
  if ( ! request.parsed ) {
    return null; // Router::is_portal() can't know yet
  }
  return request.path.startsWith( 'p/' ) ? { type: 'post', title: 'How do I change my avatar?' } : null;
};

// The first version: remembered from the first call, whenever that was.
let firstCurrent = null;
const firstVersion = () => {
  if ( null === firstCurrent ) {
    firstCurrent = detect() ?? false;
  }
  return firstCurrent ? firstCurrent : null;
};

// The fix: before the address is read, nothing is known yet: don't remember that.
let fixedCurrent; // undefined: not worked out; false: worked out, not a public page
const fixedVersion = () => {
  if ( ! request.parsed ) {
    return null;
  }
  if ( fixedCurrent === undefined ) {
    fixedCurrent = detect() ?? false;
  }
  return fixedCurrent ? fixedCurrent : null;
};

const runRequest = ( early ) => {
  firstCurrent = null;
  fixedCurrent = undefined;
  request.parsed = false;
  request.path = '';
  const log = [];
  if ( early ) {
    // plugins_loaded: an SEO plugin reads an option, which asks "what page is this?"
    log.push( `plugins_loaded: first ${ JSON.stringify( firstVersion() ) }, fixed ${ JSON.stringify( fixedVersion() ) }` );
  }
  // parse_query: WordPress has read /community/p/412.
  request.parsed = true;
  request.path = 'p/412';
  // wp_head: the title tag asks again.
  log.push( `wp_head: first ${ JSON.stringify( firstVersion()?.title ?? null ) }, fixed ${ JSON.stringify( fixedVersion()?.title ?? null ) }` );
  return log;
};

const App = () => {
  const [ early, setEarly ] = useState( true );
  const [ log, setLog ] = useState( [] );

  return (
    <div style={ { display: 'grid', gap: 12, maxWidth: 560 } }>
      <ToggleControl
        __nextHasNoMarginBottom
        label="Something asks on plugins_loaded, before the address is read"
        checked={ early }
        onChange={ setEarly }
      />
      <Button variant="primary" onClick={ () => setLog( runRequest( early ) ) }>
        Run the request
      </Button>
      <ol>
        { log.map( ( line ) => (
          <li key={ line }>
            <code>{ line }</code>
          </li>
        ) ) }
      </ol>
      <p className="fwp-muted">With the early question, the first version gives the head no title at all.</p>
    </div>
  );
};

createRoot( document.getElementById( 'forumwp-root' ) ).render( <App /> );

</script>
<script>
  // Turns the JSX above into plain JavaScript (what wp-scripts does in the course) and runs it.
  const source = document.getElementById('example').textContent;
  const { code } = Babel.transform(source, { presets: [['react', { runtime: 'automatic' }]], filename: 'example.js' });
  const run = document.createElement('script');
  run.type = 'module';
  run.textContent = code;
  document.body.appendChild(run);
</script>
